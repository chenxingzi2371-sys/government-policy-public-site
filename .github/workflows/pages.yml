name: Deploy public government policy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare public assets only
        run: |
          mkdir -p _site/data
          cp index.html style.css app.js search.mjs .nojekyll _site/
          cp data/public.json data/status.json _site/data/
          if [ -f previews/catalogue/data/public.json ]; then
            mkdir -p _site/previews/catalogue/data
            cp previews/catalogue/index.html previews/catalogue/style.css previews/catalogue/app.js previews/catalogue/search.mjs previews/catalogue/.nojekyll _site/previews/catalogue/
            cp previews/catalogue/data/public.json previews/catalogue/data/status.json _site/previews/catalogue/data/
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify anonymous HTTPS page and data
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --retry 6 --retry-delay 10 --proto '=https' "$SITE_URL" -o /tmp/public-index.html
          grep -q '政府项目申报及涉企政策检索' /tmp/public-index.html
          curl --fail --retry 6 --retry-delay 10 --proto '=https' "${SITE_URL}data/public.json" -o /tmp/public-data.json
          node --input-type=module -e 'import fs from "node:fs";const d=JSON.parse(fs.readFileSync("/tmp/public-data.json"));if(![1,2].includes(d.schema_version)||!Array.isArray(d.announcements))process.exit(1);console.log("ANONYMOUS_HTTPS_OK=true; ANNOUNCEMENTS="+d.announcements.length);'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser for anonymous live acceptance
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify live date filters, departments, counts and links
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node .github/scripts/verify-live.mjs
      - name: Verify new catalogue preview anonymously
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}previews/catalogue/
          SITE_DATA_FILE: previews/catalogue/data/public.json
          SITE_SEARCH_MODULE: ../../previews/catalogue/search.mjs
          SITE_RESULTS_DIR: live-verification-preview
        run: node .github/scripts/verify-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anonymous-live-site-verification
          path: |
            live-verification/
            live-verification-preview/


